<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Fan | Neubrutalist Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculator-wrapper">
    <!-- Chassi Principal da Calculadora -->
    <div class="calculator-chassis" id="calculator">
      <!-- Cabeçalho Neubrutalista -->
      <header class="chassis-header">
        <div class="brand-group">
          <span class="brand-badge">DEV.DESKTOP</span>
          <h1 class="brand-title">CALCULATOR FAN</h1>
        </div>
        <div class="header-actions">
          <button id="btn-toggle-history" class="btn-tool" title="Alternar Fita de Histórico (Atalho: H)" aria-label="Abrir fita de histórico">
            <span>FITA</span>
            <span class="kbd-hint">H</span>
          </button>
        </div>
      </header>

      <!-- Visor Duplo Neubrutalista -->
      <section class="display-container" aria-label="Visor da Calculadora">
        <div class="display-header">
          <span class="display-mode-tag">DECIMAL • 34 DIGITS</span>
          <span id="active-op-badge" class="active-op-badge">IDLE</span>
        </div>
        <div id="sub-display" class="sub-display" title="Histórico da Expressão">&nbsp;</div>
        <div id="main-display" class="main-display" title="Visor Principal">0</div>
      </section>

      <!-- Grade de Teclas (Keypad Grid) -->
      <section class="keypad-grid" aria-label="Teclado da Calculadora">
        <!-- Linha 1 -->
        <button type="button" class="key key-danger" data-action="clear-all" data-key="Escape">
          <span>AC</span>
          <span class="key-sub">ESC</span>
        </button>
        <button type="button" class="key key-warning" data-action="backspace" data-key="Backspace">
          <span>⌫</span>
          <span class="key-sub">DEL</span>
        </button>
        <button type="button" class="key key-aux" data-action="insert" data-value="(" data-key="(">
          <span>(</span>
        </button>
        <button type="button" class="key key-aux" data-action="insert" data-value=")" data-key=")">
          <span>)</span>
        </button>
        <button type="button" class="key key-operator" data-action="insert" data-value="÷" data-key="/">
          <span>÷</span>
        </button>

        <!-- Linha 2 -->
        <button type="button" class="key key-num" data-action="insert" data-value="7" data-key="7">7</button>
        <button type="button" class="key key-num" data-action="insert" data-value="8" data-key="8">8</button>
        <button type="button" class="key key-num" data-action="insert" data-value="9" data-key="9">9</button>
        <button type="button" class="key key-aux" data-action="negate" data-key="F9" title="Alternar Sinal Positivo/Negativo">
          <span>±</span>
        </button>
        <button type="button" class="key key-operator" data-action="insert" data-value="×" data-key="*">
          <span>×</span>
        </button>

        <!-- Linha 3 -->
        <button type="button" class="key key-num" data-action="insert" data-value="4" data-key="4">4</button>
        <button type="button" class="key key-num" data-action="insert" data-value="5" data-key="5">5</button>
        <button type="button" class="key key-num" data-action="insert" data-value="6" data-key="6">6</button>
        <button type="button" class="key key-operator" data-action="insert" data-value="-" data-key="-">
          <span>−</span>
        </button>
        <button type="button" class="key key-operator" data-action="insert" data-value="+" data-key="+">
          <span>+</span>
        </button>

        <!-- Linha 4 -->
        <button type="button" class="key key-num" data-action="insert" data-value="1" data-key="1">1</button>
        <button type="button" class="key key-num" data-action="insert" data-value="2" data-key="2">2</button>
        <button type="button" class="key key-num" data-action="insert" data-value="3" data-key="3">3</button>
        <button type="button" class="key key-num key-span-2" data-action="insert" data-value="0" data-key="0">0</button>

        <!-- Linha 5 -->
        <button type="button" class="key key-num" data-action="decimal" data-key=".">.</button>
        <button type="button" class="key key-num" data-action="decimal" data-key="," title="Vírgula Decimal ABNT2">,</button>
        <button type="button" class="key key-equal key-span-3" data-action="calculate" data-key="Enter" style="grid-column: span 3;">
          <span>=</span>
          <span class="key-sub">ENTER</span>
        </button>
      </section>

      <!-- Rodapé Neubrutalista de Atalhos -->
      <footer class="chassis-footer">
        <div class="kbd-legend">
          <span><kbd>ENTER</kbd> = Calcular</span>
          <span><kbd>ESC</kbd> = Limpar</span>
          <span><kbd>H</kbd> = Fita</span>
        </div>
      </footer>
    </div>

    <!-- Gaveta Retrátil da Fita de Histórico (Audit Tape) -->
    <aside class="tape-drawer is-hidden" id="tape-drawer" aria-label="Fita de Histórico Contínua">
      <div class="tape-jagged-top"></div>
      
      <div class="tape-inner">
        <div class="tape-header">
          <div class="tape-title-group">
            <span class="tape-badge">FITA FISCAL</span>
            <h2 class="tape-title">AUDIT LOG</h2>
          </div>
          <button id="btn-close-tape" class="btn-close-tape" aria-label="Fechar fita">✕</button>
        </div>

        <div class="tape-meta-info">
          <p>ESTAÇÃO: DESKTOP NATIVO</p>
          <p id="tape-session-time">SESSÃO: ATIVA</p>
          <div class="tape-divider"></div>
        </div>

        <!-- Lista de Entradas da Fita -->
        <div id="tape-entries" class="tape-entries">
          <div class="tape-empty-state">
            <p>NENHUM CÁLCULO REGISTRADO</p>
            <small>Execute uma operação para imprimir na fita.</small>
          </div>
        </div>

        <!-- Ações da Fita -->
        <div class="tape-footer">
          <button id="btn-export-tape" class="btn-tape-action btn-tape-export" title="Salvar histórico em arquivo TXT">
            <span>EXPORTAR RECIBO (.TXT)</span>
          </button>
          <button id="btn-clear-tape" class="btn-tape-action btn-tape-clear" title="Limpar fita">
            <span>LIMPAR FITA</span>
          </button>
        </div>
      </div>
      
      <div class="tape-jagged-bottom"></div>
    </aside>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
